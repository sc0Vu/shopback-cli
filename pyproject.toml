[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopback-tw-cli"
version = "0.1.0"
description = "Unofficial ShopBack Taiwan API CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1"]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
shopback = "shopback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
